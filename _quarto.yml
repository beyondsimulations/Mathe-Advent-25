project:
  type: website
  render:
    - index.qmd
    - 404.qmd
    - days/*.qmd
    - general/*.qmd
lang: de
website:
  title: "Mathe Advent 2025"
  site-url: https://beyondsimulations.github.io/Mathe-Advent-25
  navbar: false
  bread-crumbs: false

  page-footer:
    center: "Mathe Advent 2025, Dr. Tobias Vlćek </br> MIT License"
    left:
      - icon: github
        href: https://github.com/beyondsimulations/Mathe-Advent-25
        aria-label: GitHub-Repository
      - icon: linkedin
        href: https://linkedin.com/in/tobiasvlcek
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:vlcek@beyondsimulations.com
        aria-label: E-Mail
      - icon: skip-backward
        href: https://tobiasvlcek.com/lectures/
        aria-label: Alle Lehrveranstaltungen
      - icon: shield-check
        href: general/privacy.qmd
        aria-label: Datenschutz
      - icon: info-circle
        href: general/imprint.qmd
        aria-label: Impressum

format:
  html:
    theme:
      - default
      - styles.scss
      - brand
    toc: true
    highlight-style: github
    callout-appearance: simple
    code-overflow: wrap
    reference-location: margin
    citation-location: margin
    cap-location: margin
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    include-in-header:
      - general/header.html

execute:
  freeze: auto
  echo: false

brand: _brand.yml

filters:
  - helpers/page-pauses.lua
